<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Iniciar sesión — LUMI Bakery</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+IE:wght@100..400&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="img/logoWEB.png" />
  </head>

  <body>
    <div class="login_container">
      <form onsubmit="login(event)">
        <h2 class="subtitulos">Iniciar sesión</h2><br />

        <input
          id="email"
          type="email"
          placeholder="Email"
          required
        /><br />

        <input
          id="password"
          type="password"
          placeholder="Contraseña"
          required
        /><br /><br />

        <!-- Mensaje de error -->
        <p id="form-error" class="form-error"></p>

        <button type="submit" class="btn-ingresar">Ingresar</button>

        <div style="text-align: left; margin-top: 20px;">
          <a href="index.html" style="font-family:'Quicksand',sans-serif; font-size:13px; color:var(--primary); text-decoration:none;">
    ← Volver al inicio
          </a>
        </div>
      </form>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
